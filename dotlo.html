<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đốt Lò - Nấm Ông 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="index.html">🍄 Nấm Ông 5</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="kho.html">Kho</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="sanxuat.html">Sản xuất</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="giong.html">Giống</a></li>
                    <li class="nav-item"><a class="nav-link active text-white fw-bold" href="dotlo.html">Đốt lò</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3 class="fw-bold text-danger mb-4">🔥 Nhật ký Đốt Lò Thanh Trùng</h3>
        
        <div class="row">
            <!-- Form Nhập Nhiệt Độ -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">Cập nhật Nhiệt độ (Mỗi giờ)</h5>
                        <form id="formDotLo">
                            <div class="mb-3 row">
                                <div class="col-6">
                                    <label class="form-label small">Thời tiết</label>
                                    <input type="text" class="form-control form-control-sm" id="thoiTiet" placeholder="VD: Mưa to">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Loại củi</label>
                                    <input type="text" class="form-control form-control-sm" id="cuiDot" placeholder="VD: Củi cao su">
                                </div>
                            </div>
                            
                            <h6 class="text-primary fw-bold mt-3 border-bottom pb-1">Container 1</h6>
                            <div class="row g-2 mb-3">
                                <div class="col-3"><input type="number" class="form-control form-control-sm" id="c1_1" placeholder="ĐH 1" required></div>
                                <div class="col-3"><input type="number" class="form-control form-control-sm" id="c1_2" placeholder="ĐH 2" required></div>
                                <div class="col-3"><input type="number" class="form-control form-control-sm" id="c1_3" placeholder="ĐH 3" required></div>
                                <div class="col-3"><input type="number" class="form-control form-control-sm" id="c1_4" placeholder="ĐH 4" required></div>
                            </div>

                            <h6 class="text-warning fw-bold mt-3 border-bottom pb-1">Container 2</h6>
                            <div class="row g-2 mb-3">
                                <div class="col-3"><input type="number" class="form-control form-control-sm" id="c2_1" placeholder="ĐH 1" required></div>
                                <div class="col-3"><input type="number" class="form-control form-control-sm" id="c2_2" placeholder="ĐH 2" required></div>
                                <div class="col-3"><input type="number" class="form-control form-control-sm" id="c2_3" placeholder="ĐH 3" required></div>
                                <div class="col-3"><input type="number" class="form-control form-control-sm" id="c2_4" placeholder="ĐH 4" required></div>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 fw-bold" id="btnLuuNhietDo">Ghi Nhận Nhiệt Độ</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Biểu đồ & Bảng -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">Biểu đồ Giám sát Nhiệt độ</h5>
                        <!-- Canvas để Chart.js vẽ biểu đồ -->
                        <canvas id="bieuDoNhietDo" height="120"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nạp thư viện Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="js/modules/dotlo.js"></script>
</body>
</html>
