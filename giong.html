<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Giống - Nấm Ông 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .timeline { border-left: 3px solid #198754; padding-left: 20px; margin-left: 10px; position: relative; }
        .timeline-item { margin-bottom: 20px; position: relative; }
        .timeline-item::before {
            content: ''; position: absolute; left: -28px; top: 5px;
            width: 14px; height: 14px; background: #fff; border: 3px solid #198754; border-radius: 50%;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="index.html">🍄 Nấm Ông 5</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="kho.html">Kho</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="sanxuat.html">Sản xuất</a></li>
                    <li class="nav-item"><a class="nav-link active text-white fw-bold" href="giong.html">Giống</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="dotlo.html">Đốt lò</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="baocao.html">Báo cáo</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="quantri.html" id="navQuanTri" style="display: none;">⚙️ Quản trị</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3 class="fw-bold text-success mb-4">🧫 Quản lý Sản xuất Giống & Truy xuất</h3>
        
        <div class="row">
            <!-- Form Ghi nhận Cấy giống -->
            <div class="col-md-5">
                <div class="card shadow-sm border-0 mb-4 rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Cập nhật Nhật ký Giống</h5>
                        <form id="formGiong">
                            <div class="mb-3 row">
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Giai đoạn</label>
                                    <select class="form-select form-select-sm" id="giaiDoan" required>
                                        <option value="">Đang tải...</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Loại nấm</label>
                                    <select class="form-select form-select-sm" id="loaiNamGiong" required>
                                        <option value="">Đang tải...</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Mã lô hiện tại (Tự tạo hoặc nhập)</label>
                                <input type="text" class="form-control form-control-sm border-success text-primary fw-bold" id="maLoHienTai" placeholder="VD: F2-DC-130826" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-bold">Mã lô NGUỒN (Để truy xuất)</label>
                                <input type="text" class="form-control form-control-sm" id="maLoNguon" placeholder="Để trống nếu là Phân lập F0">
                                <div class="form-text" style="font-size: 11px;">Ví dụ: Nhập mã lô F1 để truy xuất cho lô F2.</div>
                            </div>

                            <div class="mb-3 row">
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Số lượng cấy</label>
                                    <input type="number" class="form-control form-control-sm" id="slCay" min="1" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-success">Thành phẩm đạt</label>
                                    <input type="number" class="form-control form-control-sm" id="slDat" placeholder="Cập nhật sau">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm" id="btnLuuGiong">Lưu Nhật Ký</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Trục thời gian (Timeline) Truy xuất -->
            <div class="col-md-7">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold mb-0">Timeline Lịch sử & Truy xuất</h5>
                            <div class="input-group w-50">
                                <input type="text" class="form-control form-control-sm" id="timKiemLo" placeholder="Nhập mã lô tìm kiếm...">
                                <button class="btn btn-outline-success btn-sm" id="btnTimKiem">Tìm</button>
                            </div>
                        </div>
                        
                        <!-- Khu vực hiển thị Timeline -->
                        <div class="timeline mt-2" id="khuVucTimeline" style="max-height: 500px; overflow-y: auto;">
                            <div class="text-muted small">Đang tải dữ liệu...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/modules/giong.js"></script>
</body>
</html>
