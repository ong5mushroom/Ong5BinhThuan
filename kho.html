<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Kho - Nấm Ông 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="index.html">🍄 Nấm Ông 5</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link active text-white fw-bold" href="kho.html">Kho</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="sanxuat.html">Sản xuất</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="giong.html">Giống</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="dotlo.html">Đốt lò</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="baocao.html">Báo cáo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3 class="fw-bold text-success mb-4">📦 Quản lý Kho Vật Tư</h3>
        
        <div class="row">
            <!-- Form Nhập/Xuất -->
            <div class="col-md-5">
                <div class="card shadow-sm border-0 mb-4 rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Tạo Phiếu Nhập / Xuất</h5>
                        <form id="formKho">
                            <div class="mb-3 row">
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Loại phiếu</label>
                                    <select class="form-select form-select-sm border-success text-success fw-bold" id="loaiPhieu" required>
                                        <option value="nhap">Nhập kho (+)</option>
                                        <option value="xuat">Xuất kho (-)</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Ngày thực hiện</label>
                                    <input type="date" class="form-control form-control-sm" id="ngayThucHien" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Tên vật tư</label>
                                <!-- Select rỗng, JavaScript sẽ tự động đổ dữ liệu từ Danh mục vào đây -->
                                <select class="form-select form-select-sm" id="tenVatTu" required>
                                    <option value="">Đang tải danh mục từ hệ thống...</option>
                                </select>
                            </div>

                            <div class="mb-3 row">
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Số lượng</label>
                                    <input type="number" class="form-control form-control-sm" id="soLuong" min="1" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Đơn vị tính</label>
                                    <select class="form-select form-select-sm" id="donVi" required>
                                        <option value="kg">kg</option>
                                        <option value="lít">lít</option>
                                        <option value="cái">cái</option>
                                        <option value="bịch">bịch</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold">Ghi chú (Tên NCC, Lô hàng...)</label>
                                <input type="text" class="form-control form-control-sm" id="ghiChuKho">
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm" id="btnLuuPhieu">Lưu Phiếu</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Bảng Tồn Kho -->
            <div class="col-md-7">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0">Tồn kho hiện tại</h5>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-success">
                                    <tr>
                                        <th>Mã VT</th>
                                        <th>Tên vật tư</th>
                                        <th>Tồn kho</th>
                                        <th>Đơn vị</th>
                                    </tr>
                                </thead>
                                <tbody id="bangTonKho">
                                    <tr><td colspan="4" class="text-muted text-center">Đang tải dữ liệu...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/modules/kho.js"></script>
</body>
</html>
