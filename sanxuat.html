<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Xuất - Nấm Ông 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="index.html">🍄 Nấm Ông 5</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="kho.html">Kho</a></li>
                    <li class="nav-item"><a class="nav-link active text-white fw-bold" href="sanxuat.html">Sản xuất</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="giong.html">Giống</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="dotlo.html">Đốt lò</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3 class="fw-bold text-success mb-4">🏭 Quản lý Sản xuất (Đóng phôi)</h3>
        
        <div class="row">
            <!-- Form Ghi nhận Lô mới -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">Ghi nhận Lô Phôi mới</h5>
                        <form id="formSanXuat">
                            <div class="mb-3">
                                <label class="form-label">Loại nấm</label>
                                <select class="form-select" id="loaiNam" required>
                                    <option value="Nấm Hương (không hoa cô)">Nấm Hương (dòng không hoa cô)</option>
                                    <option value="Nấm Đông Cô (có hoa cô)">Nấm Đông Cô (dòng có hoa cô)</option>
                                    <option value="Nấm Hầu Thủ">Nấm Hầu Thủ</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tổng số phôi thực hiện (bịch)</label>
                                <input type="number" class="form-control" id="tongPhoi" min="1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Số phôi Đạt</label>
                                <input type="number" class="form-control" id="phoiDat" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Số phôi Hư hỏng</label>
                                <input type="number" class="form-control" id="phoiHu" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Số phôi Tận dụng</label>
                                <input type="number" class="form-control" id="phoiTanDung" min="0" value="0">
                            </div>
                            <button type="submit" class="btn btn-success w-100" id="btnLuuLo">Lưu & Tính tỷ lệ</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Bảng Thống kê Lô Sản xuất -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">Lịch sử Đóng phôi</h5>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle text-center">
                                <thead class="table-success">
                                    <tr>
                                        <th>Ngày</th>
                                        <th>Loại Nấm</th>
                                        <th>Tổng</th>
                                        <th>Đạt</th>
                                        <th>Hư hỏng</th>
                                        <th>Tỷ lệ hư (%)</th>
                                    </tr>
                                </thead>
                                <tbody id="bangSanXuat">
                                    <tr><td colspan="6" class="text-muted">Đang tải dữ liệu...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/modules/sanxuat.js"></script>
</body>
</html>
