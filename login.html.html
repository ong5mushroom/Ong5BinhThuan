<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Nấm Ông 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh; background-color: #e8f5e9;">

    <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 400px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-success">🍄 Nấm Ông 5</h2>
                <p class="text-muted">Hệ thống Quản trị Nội bộ</p>
            </div>
            
            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label fw-bold small">Mã Nhân Viên (ID)</label>
                    <input type="text" class="form-control form-control-lg" id="maNV" placeholder="VD: GD01" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small">Mật khẩu</label>
                    <input type="password" class="form-control form-control-lg" id="password" placeholder="******" required>
                </div>
                
                <div id="loginError" class="text-danger small mb-3 text-center d-none">Sai Mã nhân viên hoặc mật khẩu!</div>
                
                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold" id="btnLogin">Đăng Nhập</button>
            </form>
        </div>
    </div>

    <!-- Gọi file login.js -->
    <script type="module" src="js/modules/login.js"></script>
</body>
</html>
