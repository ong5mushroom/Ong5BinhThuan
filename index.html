<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản trị - Nấm Ông 5 Bình Thuận</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="index.html">🍄 Nấm Ông 5</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active text-white fw-bold" href="index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="kho.html">Kho</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="sanxuat.html">Sản xuất</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="giong.html">Giống</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="dotlo.html">Đốt lò</a></li>
                    <!-- Thẻ Báo cáo và Quản trị (Mặc định ẩn, JS sẽ tự mở cho Admin) -->
                    <li class="nav-item"><a class="nav-link text-white" href="baocao.html">Báo cáo</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="quantri.html" id="navQuanTri" style="display: none;">⚙️ Quản trị</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3 fw-bold" id="tenNhanVien">Đang tải...</span>
                    <button class="btn btn-sm btn-light text-success fw-bold" id="btnDangXuat">Đăng xuất</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Lời chào tự động lấy tên người đăng nhập -->
        <div class="alert alert-success border-0 shadow-sm border-start border-5 border-success mb-4">
            <h4 class="fw-bold text-success mb-2">Chào ngày mới, <span id="tenLoiChao">...</span>! ☀️</h4>
            <p class="mb-0">Chúc mọi người một ca làm việc hiệu quả và an toàn!</p>
        </div>

        <div class="row">
            <!-- Cột trái: Điểm danh -->
            <div class="col-md-7 mb-4">
                <div class="card shadow-sm border-0 h-100 rounded-4">
                    <div class="card-body text-center p-5">
                        <h4 class="fw-bold mb-4">Điểm danh nhận việc</h4>
                        <h1 class="display-3 fw-bold text-primary mb-4" id="clock">00:00:00</h1>
                        <button class="btn btn-success btn-lg px-5 rounded-pill fw-bold shadow" id="btnNhanCa">📍 Nhận ca làm việc</button>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Bảng tin / Nhắc nhở -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm border-0 h-100 rounded-4">
                    <div class="card-header bg-white border-0 pt-4 pb-0">
                        <h5 class="fw-bold text-primary">📌 Bảng tin & Nhắc nhở</h5>
                    </div>
                    <div class="card-body">
                        
                        <!-- Khu vực hiển thị tin nhắn (Có thanh cuộn) -->
                        <div id="khuVucChat" style="max-height: 250px; overflow-y: auto; padding-right: 5px;">
                            <div class="text-muted small text-center">Đang tải bảng tin...</div>
                        </div>
                        
                        <!-- Khung nhập tin nhắn nhanh -->
                        <div class="input-group mt-3">
                            <input type="text" class="form-control form-control-sm" id="inputChat" placeholder="Nhập nhắc nhở (VD: Kiểm tra phôi)...">
                            <button class="btn btn-primary btn-sm" id="btnGuiChat">Gửi</button>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Đồng hồ kỹ thuật số -->
    <script>
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('vi-VN', { hour12: false });
        }, 1000);
    </script>
    
    <!-- Khai báo thư viện và file logic chính -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
